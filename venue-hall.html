<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venue Demo Hall Live</title>
<style>
:root{
  --bg:#f4f7fa;--panel:#fff;--line:#d7e0e8;--text:#142231;--muted:#6e7f90;
  --seat:#e2e8ee;--green:#31b969;--amber:#f0b33c;--sold:#697684;--mine:#ff9f1a;
  --danger:#c83e45
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:12px}
.page{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.title{font-size:22px;font-weight:850}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.badge{border:1px solid #bdd0df;background:#edf5fb;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#35546c}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}
.btn{border:1px solid #c7d3de;background:#fff;color:#183047;border-radius:9px;padding:8px 11px;font:inherit;font-weight:750;cursor:pointer}
.btn:hover{background:#f0f5f9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);margin-right:auto}
.status.bad{color:#b72d35}
.status.ok{color:#18743b}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:auto;overscroll-behavior:contain}
.canvas{width:100%;min-width:520px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}
.seat-info{font-weight:750;color:#2d4357}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.12)}
svg{display:block;width:100%;height:auto;background:#fff;border-radius:10px}
.seat{cursor:pointer}
.seat:hover rect{stroke:#111f2d;stroke-width:2}
.seat.disabled{cursor:not-allowed;opacity:.9}
.seat text{pointer-events:none;font-weight:800;fill:#162330}
.decor-text{font-family:Arial,sans-serif;font-weight:900;fill:#203040}
.stage-text{font-family:Arial,sans-serif;font-weight:900;fill:#fff;letter-spacing:2px}
@media(max-width:650px){body{padding:6px}.canvas{min-width:420px}.title{font-size:18px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <div id="title" class="title">Завантаження…</div>
      <div id="sub" class="sub">Venue Demo Server</div>
    </div>
    <div class="badge">DIRECT VENUE • LIVE STATE / HOLD</div>
  </div>

  <div class="toolbar">
    <div id="status" class="status">Читаємо стан майданчика…</div>
    <button id="refreshBtn" class="btn">Оновити</button>
    <button id="clearBtn" class="btn" disabled>Очистити HOLD</button>
  </div>

  <div class="panel"><div id="canvas" class="canvas"></div></div>

  <div class="foot">
    <div id="seatInfo" class="seat-info">Клік по доступному місцю створює реальний venue-side HOLD.</div>
    <div class="legend">
      <span><i class="dot" style="background:#e2e8ee"></i>геометрія</span>
      <span><i class="dot" style="background:#31b969"></i>доступно</span>
      <span><i class="dot" style="background:#ff9f1a"></i>мій HOLD</span>
      <span><i class="dot" style="background:#f0b33c"></i>чужий HOLD</span>
      <span><i class="dot" style="background:#697684"></i>продано</span>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://lyvdrqilglqwkmajmbai.supabase.co";
const SUPABASE_KEY = "sb_publishable_3iEjIeI5LxCq7kHdCQD_Iw_9nvFVMoU";
const READ_URL = `${SUPABASE_URL}/functions/v1/venue-demo-read`;
const RPC_BASE = `${SUPABASE_URL}/rest/v1/rpc`;

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const VENUE_ID = String(qs.get("venue") || "").trim();
const SEANCE_ID = String(qs.get("seance") || qs.get("seance_id") || "").trim();
const POLL_MS = 1500;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let meta = null;
let hallState = null;
let selected = new Set();
let busy = false;
let timer = null;

if (!VENUE_ID || !SEANCE_ID) {
  $("status").textContent = "Потрібні параметри ?venue=...&seance=...";
  $("status").className = "status bad";
  return;
}

function storageKey() {
  return `va-venue-direct-hold:${VENUE_ID}:${SEANCE_ID}`;
}

function validUuid(v) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v || ""));
}

function getHoldToken(forceNew = false) {
  let token = forceNew ? "" : String(localStorage.getItem(storageKey()) || "");
  if (!validUuid(token)) {
    token = crypto.randomUUID();
    localStorage.setItem(storageKey(), token);
  }
  return token;
}

async function readMeta() {
  const u = new URL(READ_URL);
  u.searchParams.set("venue_id", VENUE_ID);
  u.searchParams.set("seance_id", SEANCE_ID);

  const r = await fetch(u, { cache: "no-store" });
  const d = await r.json().catch(() => ({}));

  if (!r.ok || !d?.ok) throw new Error(d?.error || `HTTP ${r.status}`);
  if (String(d?.venue?.id || d?.venue_id || VENUE_ID) !== VENUE_ID) {
    throw new Error("venue_seance_mismatch");
  }

  return d;
}

async function rpc(name, args) {
  const r = await fetch(`${RPC_BASE}/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify(args),
    cache: "no-store"
  });

  const raw = await r.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch { data = raw; }

  if (!r.ok) {
    const message =
      (data && typeof data === "object" && (data.message || data.error || data.hint)) ||
      String(data || `HTTP ${r.status}`);
    const e = new Error(message);
    e.status = r.status;
    e.data = data;
    throw e;
  }

  return data;
}

async function readState() {
  return rpc("get_public_hall_state", {
    p_seance_id: SEANCE_ID,
    p_hold_token: getHoldToken()
  });
}

function syncSelected() {
  selected = new Set(
    (Array.isArray(hallState?.seats) ? hallState.seats : [])
      .filter(x => String(x?.state || "") === "mine")
      .map(x => String(x.seat_key))
  );
}

function postState() {
  const rows = Array.isArray(hallState?.seats) ? hallState.seats : [];
  const counts = {
    mine: rows.filter(x => x?.state === "mine").length,
    hold: rows.filter(x => x?.state === "hold").length,
    sold: rows.filter(x => ["sold","used"].includes(String(x?.state || ""))).length
  };

  try {
    window.parent?.postMessage({
      type: "va-venue-direct-state",
      venue_id: VENUE_ID,
      seance_id: SEANCE_ID,
      counts,
      at: Date.now()
    }, location.origin);
  } catch (_) {}
}

function fillForSeat(st) {
  const current = String(st?.state || "geometry").toLowerCase();

  if (current === "mine") return "#ff9f1a";
  if (current === "hold" || current === "held") return "#f0b33c";
  if (current === "sold" || current === "used") return "#697684";
  if (st?.sale_enabled === true) return st?.color || "#31b969";
  if (st?.sale_enabled === false) return "#b8c2cc";
  return "#e2e8ee";
}

function render() {
  if (!meta || !hallState) return;

  const g = meta.geometry || {};
  const seats = Array.isArray(g.seats) ? g.seats : [];
  const state = Array.isArray(hallState.seats) ? hallState.seats : [];
  const stateMap = new Map(state.map(x => [String(x.seat_key), x]));
  const W = Number(g.width || 1000), H = Number(g.height || 1200);

  $("title").textContent = meta.venue?.name || VENUE_ID;
  $("sub").textContent =
    `${meta.hall?.name || ""} • ${meta.seance?.show || SEANCE_ID} • ` +
    `${meta.seance?.date || ""} ${String(meta.seance?.time || "").slice(0,5)}`;

  const expires = hallState?.my_hold_expires_at
    ? ` • HOLD до ${new Date(hallState.my_hold_expires_at).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`
    : "";

  $("status").textContent =
    `LIVE VENUE • geometry ${seats.length} • state ${state.length}${expires}`;
  $("status").className = "status ok";
  $("clearBtn").disabled = busy || !selected.size;

  const decor = Array.isArray(g.decor) ? g.decor : [];
  const decorSvg = decor.map(o => {
    const type = String(o.type || "");
    if (type === "stage") {
      const w = Number(o.w || 0), h = Number(o.h || 0);
      const x = Number(o.x || 0) - w/2, y = Number(o.y || 0) - h/2;
      return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(18,h/2)}" fill="${esc(o.fill || "#8c929a")}"/><text class="stage-text" x="${Number(o.x||0)}" y="${Number(o.y||0)+7}" text-anchor="middle" font-size="${Math.max(18,Number(o.size||26))}">${esc(o.text || "СЦЕНА")}</text></g>`;
    }
    if (type === "text") {
      return `<text class="decor-text" x="${Number(o.x||0)}" y="${Number(o.y||0)+6}" text-anchor="middle" font-size="${Math.max(12,Number(o.size||16))}">${esc(o.text || "")}</text>`;
    }
    return "";
  }).join("");

  const seatSvg = seats.map(s => {
    const key = String(s.seat_key || "");
    const st = stateMap.get(key);
    const current = String(st?.state || "geometry").toLowerCase();
    const clickable =
      current === "mine" ||
      (current === "available" && st?.sale_enabled === true && st?.price != null);

    const w = Math.max(14,Number(s.w||14)), h = Math.max(14,Number(s.h||14));
    const x = Number(s.x||0)-w/2, y = Number(s.y||0)-h/2;
    const num = esc(s.seat_number ?? "");
    const price = st?.price != null ? ` • ${st.price} грн` : "";
    const title = esc(`${key} • ${current}${price}`);

    return `<g class="seat${clickable ? "" : " disabled"}" data-key="${esc(key)}" data-state="${esc(current)}" data-price="${esc(st?.price ?? "")}" data-clickable="${clickable ? "1" : "0"}"><title>${title}</title><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${esc(fillForSeat(st))}" stroke="#9eabb6" stroke-width="1"/><text x="${Number(s.x||0)}" y="${Number(s.y||0)+3}" text-anchor="middle" font-size="8">${num}</text></g>`;
  }).join("");

  $("canvas").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема залу">${decorSvg}${seatSvg}</svg>`;

  $("canvas").querySelectorAll(".seat").forEach(el => {
    el.addEventListener("click", async () => {
      const key = String(el.dataset.key || "");
      const state = String(el.dataset.state || "");
      const price = el.dataset.price ? ` • ${el.dataset.price} грн` : "";

      $("seatInfo").textContent = `${key} • ${state}${price}`;

      if (el.dataset.clickable !== "1" || busy) return;
      await toggleSeat(key);
    });
  });

  postState();
}

async function refresh(silent = false) {
  try {
    if (!meta) meta = await readMeta();
    hallState = await readState();
    syncSelected();
    render();
  } catch (e) {
    if (!silent) {
      $("status").textContent = "Помилка: " + (e?.message || e);
      $("status").className = "status bad";
    }
  }
}

async function saveSelection(keys, retry = true) {
  busy = true;
  $("clearBtn").disabled = true;
  $("status").textContent = "Оновлюємо реальний HOLD…";

  try {
    const token = getHoldToken();

    hallState = keys.length
      ? await rpc("set_public_hold", {
          p_seance_id: SEANCE_ID,
          p_seat_keys: keys,
          p_hold_token: token
        })
      : await rpc("release_public_hold", {
          p_seance_id: SEANCE_ID,
          p_hold_token: token
        });

    syncSelected();
    render();

    try {
      window.parent?.postMessage({
        type: "va-venue-direct-hold",
        venue_id: VENUE_ID,
        seance_id: SEANCE_ID,
        seats: [...selected],
        at: Date.now()
      }, location.origin);
    } catch (_) {}

  } catch (e) {
    const message = String(e?.message || e);

    if (retry && /consumed|hold_token/i.test(message)) {
      getHoldToken(true);
      busy = false;
      return saveSelection(keys, false);
    }

    $("status").textContent = "HOLD: " + message;
    $("status").className = "status bad";

    try {
      hallState = await readState();
      syncSelected();
      render();
    } catch (_) {}

  } finally {
    busy = false;
    $("clearBtn").disabled = !selected.size;
  }
}

async function toggleSeat(key) {
  const next = new Set(selected);
  if (next.has(key)) next.delete(key);
  else next.add(key);

  if (next.size > 12) {
    $("status").textContent = "За один раз — не більше 12 місць.";
    $("status").className = "status bad";
    return;
  }

  await saveSelection([...next]);
}

$("refreshBtn").addEventListener("click", () => refresh(false));
$("clearBtn").addEventListener("click", () => saveSelection([]));

(async () => {
  meta = await readMeta();
  await refresh(false);
  timer = setInterval(() => {
    if (!document.hidden && !busy) refresh(true);
  }, POLL_MS);
})().catch(e => {
  $("status").textContent = "Помилка: " + (e?.message || e);
  $("status").className = "status bad";
});

window.addEventListener("beforeunload", () => clearInterval(timer));
})();
</script>
</body>
</html>
